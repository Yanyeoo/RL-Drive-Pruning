  <rect x="4.5" y="186.0" width="1410.5" height="124.0" fill="#FAF8FD" stroke="#C9B7E8" stroke-width="1" rx="8"/>
  <text x="12.5" y="202.0" font-size="14" fill="#999999" font-weight="bold">Dynamic budget policy πφ</text>
