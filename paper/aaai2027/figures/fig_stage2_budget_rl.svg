  <text x="335.0" y="403.0" font-size="14" fill="#999999" font-weight="bold">Scene-adaptive allocation</text>
  <rect x="-13.0" y="507.0" width="1481.0" height="126.0" fill="#FFFDF5" stroke="#E3BF66" stroke-width="1" rx="8"/>
  <text x="-5.0" y="523.0" font-size="14" fill="#999999" font-weight="bold">Closed-loop driving reinforcement learning</text>
