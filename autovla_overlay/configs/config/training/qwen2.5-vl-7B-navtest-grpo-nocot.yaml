# =============================================================================
# 7B — GRPO RL config (NAVTEST, no-CoT) — for token pruning scorer experiments
#
# Derived from: qwen2.5-vl-3B-navtest-grpo-nocot.yaml
#
# Key difference: pretrained_model_path -> Qwen2.5-VL-7B-Instruct
# NOTE: sft_model_path still points to the 3B AutoVLA ckpt.
#       For 7B experiments, we need a 7B fine-tuned ckpt (see docs/plan).
#       If no 7B ckpt available, set sft_model_path to empty/null and use
#       the base Qwen2.5-VL-7B-Instruct directly (zero-shot baseline).
# =============================================================================
name: qwen2.5-vl-7B-navtest-grpo-nocot
description: AutoVLA-style eval on navtest with Qwen2.5-VL-7B backbone (no-CoT)

model:
  use_cot: false
  pretrained_model_path: /apdcephfs/private_shayladeng/tokenrl_autoVLA/models/Qwen2.5-VL-7B-Instruct
  # TODO: replace with 7B fine-tuned ckpt when available
  # For now, use 3B ckpt path (will fail dimension mismatch) — see scripts/run_7b_pipeline.sh
  sft_model_path: ""
  codebook_cache_path: /apdcephfs/private_shayladeng/tokenrl_autoVLA/code/third_party/AutoVLA/codebook_cache/agent_vocab.pkl
  train_vision_backbone: false
  train_lm_backbone: true
  lora:
    use: true
    task_type: CAUSAL_LM
    target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
    r: 8
    alpha: 8
    dropout: 0.1
    bias: "none"
  trajectory: # future trajectory parameters
    num_poses: 10
    interval_length: 0.5
    time_horizon: 5.0
  tokens: # action token parameters, depends on the pretrained large model
    action_start_id: 151665
    ignore_index: -100
    assistant_id: [151644, 77091]
  video:
    min_pixels: 109760
    max_pixels: 109760

data:
  train:
    json_dataset_path: /apdcephfs/private_shayladeng/tokenrl_autoVLA/data/navtrain_nocot
    sensor_data_path: /apdcephfs/private_shayladeng/tokenrl/data/navsim_v2/sensor_blobs/test/openscene-v1.1/sensor_blobs/test
    metric_cache_path: /apdcephfs/private_shayladeng/tokenrl_autoVLA/data/navtest_metric_cache
    scene_filter: ./navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtest_local_filtered.yaml
  val:
    json_dataset_path: /apdcephfs/private_shayladeng/tokenrl_autoVLA/data/navtrain_nocot
    sensor_data_path: /apdcephfs/private_shayladeng/tokenrl/data/navsim_v2/sensor_blobs/test/openscene-v1.1/sensor_blobs/test
    metric_cache_path: /apdcephfs/private_shayladeng/tokenrl_autoVLA/data/navtest_metric_cache
    scene_filter: ./navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtest_local_filtered.yaml

inference:
  batch_size: 1
  num_workers: 1
  sample:
    max_length: 2048
    temperature: 0.01
    top_k: 0.0
    top_p: 1.0

rl:
  batch_size: 1
  n_generations: 4
  lr: 5.0e-5
  warmup_ratio: 0.1
  kl_weight: 0.01
  max_grad_norm: 1.0
  reward_components:
    pdms:
      weight: 1.0
  cot_penalty:
    coef: 0
