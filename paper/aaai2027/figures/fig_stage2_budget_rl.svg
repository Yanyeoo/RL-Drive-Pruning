  <text x="1266.1" y="340.9" font-size="13" fill="#777777" text-anchor="middle">K = floor(kN)</text>
  <path d="M 1288.3,490.0 L 1307.6,532.0" stroke="#5089B7" stroke-width="3" fill="none" marker-end="url(#arrow-default)"/>
  <path d="M 1205.0,570.0 L 1185.0,570.0" stroke="#C08A18" stroke-width="3" fill="none" marker-end="url(#arrow-default)"/>
