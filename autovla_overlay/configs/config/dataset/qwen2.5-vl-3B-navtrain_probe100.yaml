
name: qwen2.5-vl-3B-navtrain_probe100
description: |
  Preprocessing dataset for AutoVLA nocot inference on a 100-token slice of
  the NAVSIM navtrain split (lexically-sorted first 100 scene tokens).
  Used by M1.a Step 5 to re-validate L*=12 on navtrain probe A
  (acceptance: vision_frac_mean ∈ [0.15, 0.22], parity with navtest L12=0.1861).
  Uses Qwen2.5-VL 3B processor only (no 72B CoT inference).

# model (processor only)
pretrained_model_path: /apdcephfs/private_shayladeng/tokenrl_autoVLA/models/Qwen2.5-VL-3B-Instruct

# preprocessing
batch_size: 1
num_workers: 8

# dataset (navtrain split, single-path layout — trainval has NO openscene-v1.1 wrapper,
#  unlike navtest's sensor_blobs/test/openscene-v1.1/sensor_blobs/test double-nesting.
#  Verified 2026-06-24 17:50 by direct ls of CAM_F0/*.jpg.)
dataset_name: nuplan
dataset_path: /apdcephfs/private_shayladeng/tokenrl/data/navsim_v2
navsim_log_path: /apdcephfs/private_shayladeng/tokenrl/data/navsim_v2/navsim_logs/trainval
sensor_blobs_path: /apdcephfs/private_shayladeng/tokenrl/data/navsim_v2/sensor_blobs/trainval
scene_filter: ./navsim/navsim/planning/script/config/common/train_test_split/scene_filter/navtrain_probe100.yaml
# ^ Newly created 2026-06-24, holds 100 lexically-sorted tokens picked from
#   navtrain.yaml's tokens: block (total 103288). See exp/m1a_navtrain_probeA_setup/tokens_100.txt.
