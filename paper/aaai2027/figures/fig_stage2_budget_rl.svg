  <rect x="321.3" y="403.2" width="125.0" height="16" fill="#FFFFFF" rx="3" opacity="0.85"/>
  <text x="383.8" y="415.2" font-size="13" fill="#777777" text-anchor="middle">policy gradient</text>
  <rect x="27.5" y="209.0" width="255.0" height="78.0" fill="#E6F5F0" stroke="#178579" stroke-width="2" rx="8"/>
  <text x="155.0" y="244.3" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">Stage-1 scored tokens</text>
  <text x="155.0" y="264.3" font-size="15" fill="#888888" text-anchor="middle">720 visual features + ranking fθ</text>
  <rect x="305.0" y="209.0" width="200.0" height="78.0" fill="#F1EAFB" stroke="#8869B5" stroke-width="2" rx="8"/>
  <text x="405.0" y="244.3" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">Mean pooling</text>
  <text x="405.0" y="264.3" font-size="15" fill="#888888" text-anchor="middle">x̄ = 1/N Σᵢ xᵢ</text>
  <rect x="520.0" y="209.0" width="220.0" height="78.0" fill="#F1EAFB" stroke="#6E50A5" stroke-width="2" rx="8"/>
  <text x="630.0" y="244.3" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">Budget head gφ</text>
  <text x="630.0" y="264.3" font-size="15" fill="#888888" text-anchor="middle">small MLP outputs μ(s)</text>
  <rect x="750.0" y="209.0" width="200.0" height="78.0" fill="#FDEBE5" stroke="#C76F55" stroke-width="2" rx="8"/>
  <text x="850.0" y="244.3" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">Gaussian policy</text>
  <text x="850.0" y="264.3" font-size="15" fill="#888888" text-anchor="middle">z ∼ N(μ(s), σ²)</text>
  <rect x="960.0" y="209.0" width="220.0" height="78.0" fill="#FDEBE5" stroke="#C76F55" stroke-width="2" rx="8"/>
  <text x="1070.0" y="244.3" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">Sigmoid squash</text>
  <text x="1070.0" y="264.3" font-size="15" fill="#888888" text-anchor="middle">k = 0.2 + 0.7σ(z)</text>
  <rect x="1192.0" y="209.0" width="200.0" height="78.0" fill="#FFF3D6" stroke="#C08A18" stroke-width="2" rx="8"/>
  <text x="1292.0" y="244.3" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">Continuous keep ratio</text>
  <text x="1292.0" y="264.3" font-size="15" fill="#888888" text-anchor="middle">k ∈ [0.2, 0.9]</text>
  <rect x="350.0" y="410.0" width="240.0" height="80.0" fill="#E6F5F0" stroke="#178579" stroke-width="2" rx="8"/>
  <text x="470.0" y="446.4" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Easy cruising scene</text>
  <text x="470.0" y="465.4" font-size="14" fill="#888888" text-anchor="middle">sampled k ≈ 0.25 · 180 tokens</text>
  <rect x="615.0" y="410.0" width="240.0" height="80.0" fill="#F1EAFB" stroke="#8869B5" stroke-width="2" rx="8"/>
  <text x="735.0" y="446.4" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Busy intersection</text>
  <text x="735.0" y="465.4" font-size="14" fill="#888888" text-anchor="middle">sampled k ≈ 0.55 · 396 tokens</text>
  <rect x="877.5" y="410.0" width="245.0" height="80.0" fill="#FDEBE5" stroke="#C76F55" stroke-width="2" rx="8"/>
  <text x="1000.0" y="446.4" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Safety-critical scene</text>
  <text x="1000.0" y="465.4" font-size="14" fill="#888888" text-anchor="middle">sampled k ≈ 0.85 · 612 tokens</text>
  <rect x="1150.0" y="410.0" width="240.0" height="80.0" fill="#EAF3FB" stroke="#5089B7" stroke-width="2" rx="8"/>
  <text x="1270.0" y="446.4" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Top-K true token drop</text>
  <text x="1270.0" y="465.4" font-size="14" fill="#888888" text-anchor="middle">physically remove 720 − K tokens</text>
  <rect x="1205.0" y="532.0" width="240.0" height="76.0" fill="#EAF3FB" stroke="#5089B7" stroke-width="2" rx="8"/>
  <text x="1325.0" y="566.5" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Frozen VLA rollout</text>
  <text x="1325.0" y="585.5" font-size="14" fill="#888888" text-anchor="middle">shortened KV sequence → trajectory</text>
  <rect x="885.0" y="530.0" width="300.0" height="80.0" fill="#FFF3D6" stroke="#C08A18" stroke-width="2" rx="8"/>
  <text x="1035.0" y="566.5" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Shaped driving quality Δ</text>
  <text x="1035.0" y="585.5" font-size="14" fill="#888888" text-anchor="middle">collision · drivable · TTC · progress · direction · comfort</text>
  <rect x="595.0" y="530.0" width="280.0" height="80.0" fill="#FFF3D6" stroke="#C08A18" stroke-width="2" rx="8"/>
  <text x="735.0" y="566.3" font-size="18" fill="#333333" text-anchor="middle" font-weight="bold">Composite reward R</text>
  <text x="735.0" y="586.3" font-size="15" fill="#888888" text-anchor="middle">λd · weighted submetric Δ + λe(1 − k)</text>
  <rect x="250.0" y="530.0" width="310.0" height="80.0" fill="#F1EAFB" stroke="#6E50A5" stroke-width="2" rx="8"/>
  <text x="405.0" y="566.5" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Group-normalized advantage</text>
  <text x="405.0" y="585.5" font-size="14" fill="#888888" text-anchor="middle">Â = (R − mean(RG)) / (std(RG) + ε)</text>
  <rect x="10.0" y="530.0" width="220.0" height="80.0" fill="#FDEBE5" stroke="#C76F55" stroke-width="2" rx="8"/>
  <text x="120.0" y="566.5" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">REINFORCE update</text>
  <text x="120.0" y="585.5" font-size="14" fill="#888888" text-anchor="middle">−Â log πφ(k | x̄) → update gφ only</text>
  <text x="750.0" y="42.0" font-size="27" fill="#17365D" text-anchor="middle">Stage 2: Dynamic Budget Learning (How Many Tokens to Keep)</text>
  <text x="750.0" y="70.0" font-size="16" fill="#526272" text-anchor="middle">A continuous Gaussian budget policy allocates aggressive pruning to easy scenes and preserves capacity for safety-critical moments.</text>
  <text x="710.0" y="122.0" font-size="15" fill="#6B4B9B" text-anchor="middle">SCENE-ADAPTIVE BUDGET POLICY</text>
  <text x="1270.0" y="122.0" font-size="15" fill="#A45A25" text-anchor="middle">CLOSED-LOOP REWARD</text>
  <text x="750.0" y="664.0" font-size="15" fill="#526272" text-anchor="middle">Only gφ receives the policy gradient; fθ remains anchored to its Stage-1 ranking initialization.</text>
</svg>
